# Kuberna Labs - Render Blueprint (Infrastructure as Code)
# One-click deploy configuration for Render
# https://render.com/docs/blueprint-spec
#
# Single host: this service runs the API and serves the exported Next.js site.
#   /api/*        -> Express routers
#   everything    -> express.static(frontend/out) from backend/src/index.ts
# Render runs `npm ci` before buildCommand, so the build only needs to generate
# the Prisma client, apply migrations, and compile every workspace.
#
# Blockchain listener: it is NOT started by `npm run start:render` (that only
# runs the API). Event indexing therefore stays off in production; the API reads
# state from the database, and `/status` reports the last processed event. To
# turn indexing on, add a second Render service with startCommand
# `npm run start:listener`, sharing DATABASE_URL / RPC_URL, and leave it out of
# this web service.

services:
  - type: web
    name: kuberna-labs
    env: node
    region: oregon
    plan: starter
    buildCommand: bash ./render-build.sh
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Supabase: DATABASE_URL is the transaction pooler (:6543, pgbouncer=true),
      # DIRECT_URL is the direct connection (:5432) used by `prisma migrate deploy`.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RPC_URL
        sync: false
      # PRIVATE_KEY is set via Render dashboard secrets — never hardcode or commit
      # Use a dedicated, low-balance deployer wallet for the backend.
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: INTENT_CONTRACT_ADDRESS
        sync: false
      - key: CERTIFICATE_NFT_CONTRACT_ADDRESS
        sync: false
      - key: PAYMENT_CONTRACT_ADDRESS
        sync: false
      - key: SUBSCRIPTION_CONTRACT_ADDRESS
        sync: false
      - key: REPUTATION_NFT_CONTRACT_ADDRESS
        sync: false
      - key: AGENT_REGISTRY_CONTRACT_ADDRESS
        sync: false
      - key: COURSE_NFT_CONTRACT_ADDRESS
        sync: false
      - key: WORKSHOP_CONTRACT_ADDRESS
        sync: false
      - key: DISPUTE_CONTRACT_ADDRESS
        sync: false
      - key: TREASURY_CONTRACT_ADDRESS
        sync: false
      - key: FEE_MANAGER_CONTRACT_ADDRESS
        sync: false
      - key: ATTESTATION_CONTRACT_ADDRESS
        sync: false
      - key: CROSSCHAIN_ROUTER_CONTRACT_ADDRESS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Same-origin in production, so this only has to name the public host.
      - key: ALLOWED_ORIGINS
        value: https://kuberna-labs.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_DIST_PATH
        sync: false
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: VIRTUAL_API_KEY
        sync: false
      - key: VIRTUAL_API_BASE_URL
        sync: false
      - key: VIRTUAL_WS_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: KITE_PASSPORT_API
        sync: false
      - key: KITE_RPC_URL
        sync: false
      - key: SILENTVERIFY_API_KEY
        sync: false
      # Dubstrata — causal financial intelligence CDN for AI agents
      - key: DUBSTRATA_API_KEY
        sync: false
      - key: DUBSTRATA_BALANCE_USDC
        sync: false
