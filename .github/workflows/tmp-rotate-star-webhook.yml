name: TEMP Rotate Star Webhook v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Create webhook, save URL to file, emit encrypted ciphertext only
        id: create
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KEY: ${{ secrets.ROTATE_TMP_KEY }}
          CHANNEL_ID: '1519005329462132992'
        run: |
          RESP=$(curl -s -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"GitHub Stars"}' \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/webhooks")
          URL=$(printf '%s' "$RESP" | jq -r '.url // empty')
          ID=$(printf '%s' "$RESP" | jq -r '.id // empty')
          if [ -z "$URL" ]; then
            echo "::error::webhook creation failed"
            printf '%s' "$RESP" | jq . >&2
            exit 1
          fi
          printf '%s' "$URL" > /tmp/whurl
          echo "created webhook id ${ID}"
          printf 'CIPHERTEXT:'
          printf '%s' "$URL" | openssl enc -aes-256-cbc -pbkdf2 -a -A -salt -pass env:KEY
          echo ""
      - name: Post test embed (URL from file, not env)
        run: |
          URL=$(cat /tmp/whurl)
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"content":"⭐ Star feed reconnected (webhook rotated 2026-08-16)"}' \
            "$URL"
          echo "test embed posted"
      - name: Purge spam messages in #star-feed with diagnostics
        run: |
          BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
          CHANNEL_ID='1519005329462132992'
          MSGS=$(curl -s -w "\nHTTP:%{http_code}" \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages?limit=50")
          printf '%s\n' "$MSGS" | tail -1
          ids=$(printf '%s' "$MSGS" | jq -r 'if type=="array" then (.[] | select((.content // "") | test("insanityz|femboy kaskar|eating-cats"; "i")) | .id) else empty end' 2>/dev/null)
          if [ -z "$ids" ]; then
            echo "no matching spam messages found in last 50"
            printf '%s' "$MSGS" | head -c 300
            echo ""
            exit 0
          fi
          while IFS= read -r mid; do
            [ -z "$mid" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bot ${BOT_TOKEN}" \
              "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages/${mid}")
            echo "deleted ${mid} -> ${code}"
          done <<< "$ids"
