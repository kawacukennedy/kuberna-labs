name: TEMP Purge Star Feed Spam v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Femboy Kaskar spam messages
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '1519005329462132992'
        run: |
          BODY=$(curl -s \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages?limit=50")
          ids=$(printf '%s' "$BODY" | jq -r '
            if type=="array" then
              (.[] | select(
                (.author.username | test("femboy"; "i"))
                or (.content // "" | test("insanityz|femboy kaskar|eating-cats"; "i"))
                or (([.embeds[]?.description // ""] | join(" ")) | test("insanityz|femboy kaskar|eating-cats"; "i"))
              ) | .id)
            else empty end' 2>/dev/null)
          if [ -z "$ids" ]; then
            echo "no femboy/spam messages found"
            exit 0
          fi
          while IFS= read -r mid; do
            [ -z "$mid" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bot ${BOT_TOKEN}" \
              "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages/${mid}")
            echo "deleted ${mid} -> ${code}"
          done <<< "$ids"
