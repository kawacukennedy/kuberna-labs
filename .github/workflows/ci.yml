name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"

      - name: Run Prettier
        run: npm run format:check

      - name: Run Solhint
        run: npx solhint 'contracts/**/*.sol'

  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

      - name: Generate coverage report
        run: npx hardhat coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: contracts
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  test-sdk:
    name: Test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SDK tests
        run: |
          cd sdk
          npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Run Slither (Smart Contract Security)
        uses: crytic/slither-action@v0.3.0
        continue-on-error: true
        with:
          target: 'contracts/'
          slither-args: '--filter-paths "node_modules|test"'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-contracts, test-backend, test-sdk, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build contracts
        run: npx hardhat compile

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Build SDK
        run: |
          cd sdk
          npm run build

      - name: Build frontend
        run: |
          set -o pipefail
          cd frontend
          npm run build 2>&1 | tee "$RUNNER_TEMP/next-build.log"

      # The site renders motion with its own shader + three.js renderer, so the
      # Remotion player must never reach the static export again: it cost 82 kB
      # gzip, printed a licence nag and started an AudioContext nobody asked for.
      - name: Check the exported site has no Remotion player
        run: |
          cd frontend
          test -d out/_next/static/chunks
          if grep -rlE 'acknowledgeRemotionLicense|AbsoluteFillWithTiming|@remotion/player' out/_next/static/chunks; then
            echo '::error::Remotion player code shipped in the site bundle'
            exit 1
          fi
          echo 'Site bundle is free of the Remotion player.'

      # First-load JS is the number users feel on a cold visit. The heaviest
      # route sits at ~204 kB today, so this catches regressions without
      # blocking unrelated work. Lower the budget when a route gets lighter.
      - name: Check first-load JS budget
        env:
          MAX_FIRST_LOAD_KB: '220'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/next-build.log"
          if [ ! -s "$log" ]; then
            echo '::error::next build log is missing, so the JS budget cannot be checked'
            exit 1
          fi
          awk -v max="$MAX_FIRST_LOAD_KB" '
            / kB$/ {
              n = $(NF - 1)
              if (n ~ /^[0-9]+(\.[0-9]+)?$/) {
                seen++
                if (n + 0 > worst) { worst = n + 0; where = $0 }
              }
            }
            END {
              if (!seen) {
                print "::error::could not parse First Load JS from the next build output"
                exit 1
              }
              printf "Heaviest first-load JS: %.1f kB (budget %s kB)\n%s\n", worst, max, where
              if (worst + 0 > max + 0) {
                printf "::error::first-load JS %.1f kB exceeds the %s kB budget\n", worst, max
                exit 1
              }
            }
          ' "$log"

      - name: Collect git stats
        id: git-stats
        run: |
          echo "commit_msg=$(git log -1 --format='%s' HEAD)" >> $GITHUB_OUTPUT
          echo "commit_author=$(git log -1 --format='%an' HEAD)" >> $GITHUB_OUTPUT
          echo "commit_timestamp=$(git log -1 --format='%aI' HEAD)" >> $GITHUB_OUTPUT
          echo "files_changed=$(git diff --stat HEAD~1..HEAD 2>/dev/null | tail -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "insertions=$(git diff --stat HEAD~1..HEAD 2>/dev/null | tail -1 | awk '{print $4}')" >> $GITHUB_OUTPUT
          echo "deletions=$(git diff --stat HEAD~1..HEAD 2>/dev/null | tail -1 | awk '{print $6}')" >> $GITHUB_OUTPUT

      - name: Send Discord notification — build failed
        if: github.ref == 'refs/heads/main' && failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_TITLE: "❌ Build Failed"
          NOTIFY_DESC: "CI pipeline failed for [${{ github.repository }}@${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
          NOTIFY_COMMIT_SHA: ${{ github.sha }}
          NOTIFY_COMMIT_MSG: ${{ steps.git-stats.outputs.commit_msg }}
          NOTIFY_COMMIT_AUTHOR: ${{ steps.git-stats.outputs.commit_author }}
          NOTIFY_BRANCH: ${{ github.ref_name }}
          NOTIFY_FILES_CHANGED: ${{ steps.git-stats.outputs.files_changed }}
          NOTIFY_INSERTIONS: ${{ steps.git-stats.outputs.insertions }}
          NOTIFY_DELETIONS: ${{ steps.git-stats.outputs.deletions }}
          NOTIFY_JOBS: '[]'
          NOTIFY_ENV: "production"
          NOTIFY_VERSION: "1.0.2"
          NOTIFY_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_DEPLOY_URL: "https://dashboard.render.com/web/srv-d80v019kh4rs73e6072g"
        run: |
          npx ts-node scripts/notify-discord.ts

      - name: Send Discord notification — build succeeded
        if: github.ref == 'refs/heads/main' && success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_TITLE: "Build Succeeded"
          NOTIFY_DESC: "CI pipeline passed for [${{ github.repository }}@${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
          NOTIFY_COMMIT_SHA: ${{ github.sha }}
          NOTIFY_COMMIT_MSG: ${{ steps.git-stats.outputs.commit_msg }}
          NOTIFY_COMMIT_AUTHOR: ${{ steps.git-stats.outputs.commit_author }}
          NOTIFY_COMMIT_TIMESTAMP: ${{ steps.git-stats.outputs.commit_timestamp }}
          NOTIFY_BRANCH: ${{ github.ref_name }}
          NOTIFY_FILES_CHANGED: ${{ steps.git-stats.outputs.files_changed }}
          NOTIFY_INSERTIONS: ${{ steps.git-stats.outputs.insertions }}
          NOTIFY_DELETIONS: ${{ steps.git-stats.outputs.deletions }}
          NOTIFY_FEATURES: ${{ vars.NOTIFY_FEATURES || '[]' }}
          NOTIFY_IMPROVEMENTS: ${{ vars.NOTIFY_IMPROVEMENTS || '[]' }}
          NOTIFY_FIXES: ${{ vars.NOTIFY_FIXES || '[]' }}
          NOTIFY_JOBS: '[{"name":"Lint","status":"success"},{"name":"Contracts","status":"success"},{"name":"Backend","status":"success"},{"name":"SDK","status":"success"},{"name":"Security","status":"success"},{"name":"Frontend","status":"success"},{"name":"Build","status":"success"}]'
          NOTIFY_ENV: "production"
          NOTIFY_VERSION: "1.0.2"
          NOTIFY_APP_URL: "https://kuberna-labs.onrender.com"
          NOTIFY_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_DEPLOY_URL: "https://dashboard.render.com/web/srv-d80v019kh4rs73e6072g"
          NOTIFY_DURATION: "${{ github.run_duration }}"
        run: |
          npx ts-node scripts/notify-discord.ts

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm test


  test-aip-adapter:
    name: Test AIP Adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # packages/aip-adapter is intentionally outside the root workspaces, so it
      # needs its own install. Running it from a fresh checkout is what proves
      # the `test:aip-adapter` leg works on a clean clone.
      - name: Install dependencies
        run: |
          cd packages/aip-adapter
          npm ci

      - name: Run tests
        run: |
          cd packages/aip-adapter
          npm test
