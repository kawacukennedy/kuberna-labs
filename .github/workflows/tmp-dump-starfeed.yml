name: TEMP Dump Star Feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: List messages in #star-feed
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '1519005329462132992'
        run: |
          BODY=$(curl -s \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages?limit=20")
          printf '%s' "$BODY" | jq -r 'if type=="array" then .[] | "\(.id) | webhook=\(.webhook_id // "-") | author=\(.author.username) | content=\(.content[0:60] | gsub("\n"; " "))" else . end' 2>&1
