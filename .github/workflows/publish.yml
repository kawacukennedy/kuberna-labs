name: Publish SDK to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish @kuberna/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test
        working-directory: sdk

      - name: Build
        run: npm run build
        working-directory: sdk

      - name: Check version against registry
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          REGISTRY_VERSION=$(npm view @kuberna/sdk version 2>/dev/null || echo "0.0.0")
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "registry_version=$REGISTRY_VERSION" >> $GITHUB_OUTPUT
          if [ "$PACKAGE_VERSION" != "$REGISTRY_VERSION" ]; then
            echo "needs_publish=true" >> $GITHUB_OUTPUT
          else
            echo "needs_publish=false" >> $GITHUB_OUTPUT
          fi
        working-directory: sdk

      # Auth: npm Trusted Publishing (OIDC) via id-token: write — no NPM_TOKEN.
      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        if: steps.check.outputs.needs_publish == 'true'
        run: |
          npm publish --provenance --access public
        working-directory: sdk
